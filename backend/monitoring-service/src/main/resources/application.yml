server:
  port: 8081

spring:
  application:
    name: monitoring-service
  datasource:
    url: jdbc:sqlite:${METATWINWEAR_DB_PATH:./data/metatwinwear.sqlite}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  flyway:
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

metatwinwear:
  tool-catalog:
    image-root: ${METATWINWEAR_TOOL_IMAGE_ROOT:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
